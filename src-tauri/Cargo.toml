[package]
name = "sanwufan"
version = "1.0.0"
description = "三五反 · 山西阳泉四人扑克"
authors = ["lunaBack"]
edition = "2021"

[lib]
name = "sanwufan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
